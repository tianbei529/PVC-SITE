faq_1_q: "What is the difference between cast and extruded acrylic sheet?"
faq_1_a: "Cast acrylic is made in a cell between glass plates; it has the best optical clarity, is easier to machine and polish, and is the standard choice for signage and display. Extruded acrylic is made continuously through a die; thickness is very consistent and it is more economical for flat panels, but it machines less cleanly and is not recommended for deep thermoforming of thick sections."
faq_2_q: "What is your MOQ and lead time?"
faq_2_a: "MOQ is 500 kg for clear stock thicknesses and 500 kg per colour for custom colours. Clear stock ships in 5–7 working days; coloured, frosted or mirror sheets take 15–20 working days after colour approval."
faq_3_q: "Can you cut to size and provide samples?"
faq_3_a: "Yes — we cut to size, CNC-route and polish on request, and we send free A4 samples of up to 5 specifications. You only pay the express freight, which we refund on your first order."
