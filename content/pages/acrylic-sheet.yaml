intro_eyebrow: "Product Overview"
intro_h2: "What is acrylic sheet?"
intro_p1: "Acrylic sheet — also called plexiglass, PMMA sheet or perspex — is a transparent thermoplastic with up to 92% light transmission, better impact resistance than glass and roughly half the weight. It can be laser-cut, CNC-routed, bent, polished and bonded, which makes it the material of choice for signage, retail display, sanitary ware and machine guards."
intro_p2: "We produce both cell-cast and extruded acrylic on four dedicated lines. Cast sheet offers the best optical quality and is easy to machine and polish; extruded sheet is more economical for flat panels in high volume. Both are available clear, tinted, opaque, frosted or mirrored, with protective film on both faces."

feature_1_t: "92% light transmission"
feature_1_d: "Optical clarity better than glass, with no green edge tint on our cast clear grade. Ideal for display covers and lenses."
feature_2_t: "Cast & extruded in-house"
feature_2_d: "Cast for optical quality and easy machining; extruded for economical flat panels in volume. We quote both so you can compare."
feature_3_t: "Any colour, frosted or mirror"
feature_3_d: "Full RAL / Pantone range, matte and frosted finishes, silver and coloured mirror. Custom widths up to 2050 mm from 500 kg per colour."
feature_4_t: "Laser-cut & CNC ready"
feature_4_d: "Sheets can be laser-cut, CNC-routed, flame-polished and bonded with acrylic adhesive. Masking film protects both faces in transit."

