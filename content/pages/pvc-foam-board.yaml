faq_1_q: "What is the difference between Celuka and free foam PVC board?"
faq_1_a: "Celuka board has a hard, dense outer skin over a fine-cell core — smoother surface, higher rigidity, best for printing and signage. Free foam board has a more uniform density through the thickness, which makes cutting, routing and screw-holding easier and it is more economical for furniture and interior fit-out."
faq_2_q: "What is your MOQ and lead time?"
faq_2_a: "MOQ is 500 kg for stock specifications and 3 tons for custom colours or formulations. Stock specifications ship in 5–7 working days; custom colours or flame-retardant boards take 15–20 working days after confirmation."
faq_3_q: "Can I get free samples?"
faq_3_a: "Yes. We send free A4 samples of up to 5 specifications; you only pay the express freight, which we refund on your first order."
