intro_eyebrow: "Product Overview"
intro_h2: "What is PVC foam board?"
intro_p1: "PVC foam board — also sold as expanded PVC sheet, forex board, Sintra-style sheet or PVC foam sheet — is a rigid, lightweight panel made from polyvinyl chloride resin with a closed-cell foam core. It replaces wood in wet areas, takes paint and UV print without priming, and can be worked with ordinary woodworking tools."
intro_p2: "Every sheet we ship is produced in-house: we control the resin formulation, the foaming temperature and the cooling line speed, so density and thickness stay consistent from the first sheet to the last in your container. Boards are lead-free, formaldehyde-free, termite-proof and 100% waterproof."

feature_1_t: "Hard skin, dense core"
feature_1_d: "Celuka boards are co-extruded with a hard glossy skin and a fine closed-cell core — dimensionally stable under UV print and screen print."
feature_2_t: "Density you can specify"
feature_2_d: "0.30 g/cm³ for lightweight signage and display up to 0.75 g/cm³ for structural furniture panels. Same thickness, different weight — we quote both."
feature_3_t: "Cut, route, weld, bend"
feature_3_d: "Saw, drill, screw, heat-bend at 110–130 °C and solvent-weld. Standard woodworking equipment is all you need."
feature_4_t: "Waterproof & lead-free"
feature_4_d: "Water absorption below 0.2%, no lead or formaldehyde. Suitable for wet areas, kitchens, bathrooms and outdoor signage frames."

table_h2: "Standard specifications & weight per sheet"
table_note: "Weight per sheet is calculated for the standard 1220 × 2440 mm sheet. Custom widths up to 2050 mm, custom lengths, densities and colours available."

